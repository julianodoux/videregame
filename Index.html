<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google</title>

<style>
body{
font-family:Arial;
text-align:center;
margin-top:100px;
padding:10px;
}

.logo span:nth-child(1){color:#4285F4;}
.logo span:nth-child(2){color:#EA4335;}
.logo span:nth-child(3){color:#FBBC05;}
.logo span:nth-child(4){color:#4285F4;}
.logo span:nth-child(5){color:#34A853;}
.logo span:nth-child(6){color:#EA4335;}

.logo{
font-size:60px;
font-weight:bold;
}

input{
width:90%;
padding:12px;
border-radius:30px;
border:1px solid #ccc;
}

button{
padding:10px 20px;
margin-top:10px;
}

.captcha-bg{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
}

.captcha{
background:#fff;
width:90%;
max-width:350px;
margin:50px auto;
padding:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:5px;
}

img{
width:100%;
}

.selected{
border:4px solid blue;
}

.final{
font-size:18px;
}
</style>
</head>

<body>

<div class="logo">
<span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
</div>

<form onsubmit="abrirCaptcha(); return false;">
<br>
<input placeholder="Pesquisar no Google">
<br>
<button>Pesquisar</button>
</form>

<div class="captcha-bg" id="bg">
<div class="captcha">

<p id="texto">Selecione todas as imagens com ônibus</p>

<div class="grid" id="grid"></div>

<br>
<button onclick="falhou()">Verificar</button>
<p id="erro"></p>

</div>
</div>

<script>

var tentativas=0;

var desafios=[
"ônibus","semáforos","hidrantes","escadas",
"motos","carros","bicicletas","faixas de pedestres"
]

function abrirCaptcha(){
document.getElementById("bg").style.display="block";
carregar();
}

function carregar(){
var grid=document.getElementById("grid");
grid.innerHTML="";
for(let i=0;i<9;i++){
var img=document.createElement("img");
img.src="https://picsum.photos/100?"+Math.random();
img.onclick=function(){
this.classList.toggle("selected");
}
grid.appendChild(img);
}
}

function falhou(){

tentativas++;

if(tentativas>=5){

document.querySelector(".captcha").innerHTML=
'<div class="final">⚠️ Muitas tentativas.<br><br>'+
'Tente novamente mais tarde.<br><br>'+
'Ou ligue diretamente para a emergência:<br><br>'+
'<b style="font-size:40px">192</b></div>';

return;
}

document.getElementById("erro").innerHTML="❌ Tente novamente";

document.getElementById("texto").innerHTML=
"Selecione todas as imagens com "+
desafios[Math.floor(Math.random()*desafios.length)];

carregar();
}

</script>

</body>
</html>
