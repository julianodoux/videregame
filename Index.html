<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 150px;
    background: #fff;
}

.logo {
    font-size: 80px;
    font-weight: bold;
    color: #4285F4;
}

input {
    width: 500px;
    padding: 12px;
    border-radius: 30px;
    border: 1px solid #ccc;
    outline: none;
}

button {
    margin-top: 20px;
    padding: 10px 20px;
}

.captcha-bg {
    display: none;
    position: fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    background: rgba(0,0,0,0.4);
}

.captcha-box {
    width:300px;
    background:#fff;
    padding:20px;
    margin:200px auto;
    text-align:left;
    border-radius:5px;
}

.checkbox {
    width:20px;
    height:20px;
}
</style>

</head>

<body>

<div class="logo">Google</div>

<form onsubmit="mostrarCaptcha(); return false;">
    <br>
    <input type="text" placeholder="Pesquisar no Google">
    <br>
    <button>Pesquisar</button>
</form>

<div class="captcha-bg" id="captcha">
    <div class="captcha-box">
        <input type="checkbox" class="checkbox" onclick="verificando()"> 
        Não sou um robô
        <p id="status"></p>
    </div>
</div>

<script>
function mostrarCaptcha(){
    document.getElementById("captcha").style.display = "block";
}

function verificando(){
    document.getElementById("status").innerHTML = "Verificando...";
    setTimeout(()=>{
        document.getElementById("status").innerHTML = "Você é humano 👍";
    },2000)
}
</script>

</body>
</html>
